<!doctype html>
<!-- The link preview (Open Graph image, 1200×630): the welcome's sunrise over the flag's colours.
     Rendered to public/og.png by `node scripts/brand.mjs`. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Newsreader"; src: url("../node_modules/@fontsource-variable/newsreader/files/newsreader-latin-opsz-normal.woff2") format("woff2"); font-weight: 200 800; }
  @font-face { font-family: "Geist"; src: url("../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #0c0a09;
    font-family: "Geist", sans-serif;
    color: #f6efe6;
  }
  /* blue above, red below, as on the flag, in soft drifting light */
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); }
  .b1 { width: 760px; height: 520px; left: -120px; top: -260px; background: #1747b0; opacity: 0.75; }
  .b2 { width: 700px; height: 480px; right: -160px; top: -200px; background: #1f58c8; opacity: 0.6; }
  .r1 { width: 820px; height: 460px; left: 120px; bottom: -300px; background: #b3182e; opacity: 0.7; }
  .r2 { width: 520px; height: 420px; right: -120px; bottom: -220px; background: #c92234; opacity: 0.55; }
  .sun { width: 440px; height: 440px; left: 40px; top: 90px; background: #ffc24a; opacity: 0.32; filter: blur(80px); }
  /* the white triangle at the hoist, as a haze */
  .tri {
    position: absolute; left: -40px; top: -40px; bottom: -40px; width: 300px;
    clip-path: polygon(0 0, 100% 50%, 0 100%);
    background: linear-gradient(90deg, rgba(255, 250, 240, 0.2), transparent);
    filter: blur(24px);
  }
  .star {
    position: absolute; width: 18px; height: 18px; background: #fcd116;
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    filter: drop-shadow(0 0 8px #fcd116);
  }
  .s1 { left: 26px; top: 30px; } .s2 { left: 26px; bottom: 30px; } .s3 { left: 214px; top: 306px; }
  .card { position: absolute; inset: 0; display: flex; align-items: center; gap: 64px; padding: 0 96px 0 132px; }
  .card img { width: 250px; height: 250px; flex-shrink: 0; filter: drop-shadow(0 24px 50px rgba(0, 0, 0, 0.45)); }
  h1 { font-family: "Newsreader", serif; font-weight: 500; font-size: 92px; line-height: 1; letter-spacing: -0.02em; margin: 0 0 22px; }
  p { margin: 0; font-size: 30px; line-height: 1.4; color: rgba(246, 239, 230, 0.78); max-width: 620px; }
  .site { margin-top: 30px; font-size: 22px; letter-spacing: 0.04em; color: #ffc27a; }
</style>
</head>
<body>
  <div class="glow b1"></div><div class="glow b2"></div><div class="glow r1"></div><div class="glow r2"></div>
  <div class="glow sun"></div>
  <div class="tri"></div>
  <i class="star s1"></i><i class="star s2"></i><i class="star s3"></i>
  <div class="card">
    <img src="icon.svg" alt="">
    <div>
      <h1>Wikang Tagalog</h1>
      <p>Learn Tagalog by reading and listening to what you love, one word at a time.</p>
      <div class="site">wikangtagalog.com</div>
    </div>
  </div>
</body>
</html>
